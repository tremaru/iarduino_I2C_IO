name =			iarduino_I2C_IO
version =		1.1.6
author =		iarduino <shop@iarduino.ru>
maintainer =	iarduino <shop@iarduino.ru>
sentence =		Библиотека для работы с Trema I2C расширителями выводов на базе чипа PCA9534D.
paragraph =		Работает как с аппаратной, так и с программной шиной I2C. Модули имеют 8 полноценных двунаправленных выводов и снабжены тремя переключателями для выбора адреса на шине I2C. Преимуществом данной библиотеки является то, что она предоставляет возможность управления выводами модулей, как через функции объекта библиотеки (при подключении файла «iarduino_I2C_IO.h»), так и через стандартные функции управления цифровыми выводами (при подключении файла iarduino_I2C_IO_Global.h»).
category =		Signal Input/Output
url =			http://iarduino.ru/file/285.html
architectures =	avr,esp8266,esp32,mbed_rp2040,renesas_uno
includes =      iarduino_I2C_IO.h